<!DOCTYPE html>
<html>

<head>

<title>Health Tracker AI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">

<h1>🏥 Health Tracker AI</h1>


<div class="robot">

<div class="doctor">
🤖🥼
</div>

<h2 id="message">
Hello! I am your health assistant.
</h2>

</div>



<div class="card">

<h3>💊 Medicine Tracker</h3>

<input id="medicineName" placeholder="Medicine name">

<input id="medicineTime" placeholder="Time (Example: 8 AM)">

<button onclick="addMedicine()">
➕ Add Medicine
</button>

<div id="medicineList">
No medicines added
</div>

</div>



<div class="card">

<h3>💧 Water Tracker</h3>

<p id="water">
0 / 8 glasses
</p>

<button onclick="addWater()">
+ Water
</button>

</div>



<div class="card">

<h3>😴 Sleep</h3>

<p>Track your sleep</p>

</div>



<button onclick="speak()">
🔊 Talk Robot
</button>


<button onclick="healthAdvice()">
🤖 Get Advice
</button>


<button onclick="darkMode()">
🌙 Dark Mode
</button>


<div class="card">

<h3>🤖 Robot Advice</h3>

<p id="advice">
Click get advice
</p>

</div>


</div>

<div class="card">

<h3>🩺 Ask Health Robot</h3>

<input 
id="healthQuestion"
placeholder="Enter condition (Example: fever)">


<button onclick="healthSearch()">
🔍 Search
</button>

<button onclick="speakDisease()">
🔊 Talk
</button>


<p id="healthAnswer">
Ask me about a condition
</p>


</div>
  
<script src="script.js"></script>


</body>

</html>
